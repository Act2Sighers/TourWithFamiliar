<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>TourWithFamiliar Prototype</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <button id="btn-menu" type="button" aria-label="メニュー">☰</button>
      <button id="btn-debug" type="button" aria-label="調整パネル">⚙</button>
    </div>

    <div id="overlay" hidden>
      <div class="overlay-card">
        <h1>メニュー</h1>
        <p>ワールドの時間は止まっています</p>
        <button id="btn-resume" type="button">再開</button>
        <p class="hint">Esc / P / ゲームパッドStart / ☰ で開閉</p>
      </div>
    </div>

    <aside id="debug" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
