<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>TourWithFamiliar Prototype</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <button id="btn-menu" type="button" aria-label="メニュー">☰</button>
      <button id="btn-debug" type="button" aria-label="調整パネル">⚙</button>
    </div>

    <button id="btn-interact" type="button" hidden>助ける<small>E / A</small></button>

    <div id="defeat" hidden>倒れた</div>

    <div id="dialog" hidden>
      <div class="dialog-card">
        <p id="dialog-message"></p>
        <div class="dialog-buttons">
          <button id="dialog-yes" type="button">はい</button>
          <button id="dialog-no" type="button">いいえ</button>
        </div>
        <p class="hint" id="dialog-hint"></p>
      </div>
    </div>

    <div id="select" hidden>
      <div class="select-panel">
        <h1>最初の側近を選んでください</h1>
        <div id="select-list"></div>
        <button id="select-start" type="button" disabled>開始</button>
        <p class="hint">← → / 十字キーで選ぶ　Enter / A で決定(選んだあと、もう一度で開始)<br />画面のタップでも操作できます</p>
      </div>
    </div>

    <div id="base-screen" hidden>
      <div class="select-panel">
        <h1>拠点</h1>
        <div id="base-list" class="member-list"></div>
        <button id="base-depart" type="button">遠征に出る</button>
        <p class="hint">Enter / A で、遠征の準備へ進みます<br />拠点では、HPは自然には回復しません(遠征中に、拠点に残したファミリアが回復します)</p>
      </div>
    </div>

    <div id="party-screen" hidden>
      <div class="select-panel">
        <h1>遠征に連れていくファミリアを選んでください</h1>
        <div id="party-list" class="member-list"></div>
        <p id="party-info"></p>
        <div class="party-buttons">
          <button id="party-go" type="button">出発</button>
          <button id="party-back" type="button">戻る</button>
        </div>
        <p class="hint">← → で移動、Enter / A で選ぶ・出発　Esc / B で戻る<br />画面のタップでも操作できます</p>
      </div>
    </div>

    <button id="btn-to-base" type="button" hidden>拠点へ</button>

    <div id="overlay" hidden>
      <div class="overlay-card">
        <h1>メニュー</h1>
        <p>ワールドの時間は止まっています</p>
        <button id="btn-resume" type="button">再開</button>
        <button id="btn-abort" type="button" class="secondary">拠点に戻る</button>
        <p class="hint">Esc / P / ゲームパッドStart / ☰ で開閉</p>
      </div>
    </div>

    <aside id="debug" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
